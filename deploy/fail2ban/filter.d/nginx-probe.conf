# Salin ke /etc/fail2ban/filter.d/nginx-probe.conf
#
# Menangkap permintaan yang ditutup nginx dengan 444 (pemindai yang dikenali)
# serta 403/405.
#
# Catatan tentang 444: nginx menutup koneksi tanpa mengirim jawaban, tapi ia
# tetap menuliskan `444` ke access log. Itulah yang dibaca di sini.
#
# 404 sengaja TIDAK ikut. Situs sungguhan menghasilkan 404 sepanjang hari:
# tautan lama, drama yang dihapus, gambar yang hilang, bot mesin pencari yang
# mengejar URL usang. Memasukkannya berarti memblokir Googlebot dan pengunjung
# yang membuka tautan lama dari Telegram — dan pemindaian sungguhan sudah
# tertangkap lewat 444 di atas.

[Definition]

failregex = ^<HOST> .* "(GET|POST|HEAD|[A-Z]+) [^"]*" (444|403|405)

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}

# Salin ke /etc/fail2ban/filter.d/nginx-banjir.conf
#
# Menangkap 429 yang dikeluarkan `limit_req` / `limit_conn` di nginx.
#
# Format log bawaan nginx (`combined`):
#   1.2.3.4 - - [12/Aug/2026:10:00:00 +0700] "GET /trending HTTP/1.1" 429 ...
#
# `<HOST>` adalah placeholder fail2ban untuk alamat IP; ia menuliskan pola
# IPv4 maupun IPv6 sendiri, jadi jangan diganti dengan regex IP buatan sendiri
# — jail akan diam-diam melewatkan seluruh pengunjung IPv6.

[Definition]

failregex = ^<HOST> .* "(GET|POST|HEAD) [^"]*" 429

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}

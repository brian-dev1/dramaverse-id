# Salin ke /etc/fail2ban/filter.d/laravel-login.conf
#
# Membaca storage/logs/keamanan-YYYY-MM-DD.log, ditulis oleh
# App\Listeners\CatatKegagalanLogin.
#
# Barisnya berbentuk:
#   [2026-08-12 10:00:00] production.WARNING: Login admin gagal
#   {"ip":"1.2.3.4","email":"ad***@contoh.id","agen":"..."}
#
# Perhatikan bahwa emailnya sudah disamarkan di sisi aplikasi. Log ini dibaca
# proses lain, dirotasi, dan kadang ikut tersalin saat menyelidiki masalah —
# alamat email lengkap milik admin tidak perlu ada di sana untuk menghitung
# percobaan gagal.

[Definition]

failregex = ^\[.*\] .*Login admin gagal .*"ip":"<HOST>"

ignoreregex =

datepattern = ^\[({DATE})\]

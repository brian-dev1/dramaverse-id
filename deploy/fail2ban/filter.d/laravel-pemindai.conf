# Salin ke /etc/fail2ban/filter.d/laravel-pemindai.conf
#
# Membaca storage/logs/keamanan-YYYY-MM-DD.log, ditulis oleh middleware
# App\Http\Middleware\BlockProbeRequests.
#
# Barisnya berbentuk:
#   [2026-08-12 10:00:00] production.WARNING: Permintaan pemindai ditolak
#   {"alasan":"jalur","ip":"1.2.3.4","path":"wp-admin","agen":"..."}
#
# IP diambil dari konteks JSON, bukan dari awal baris — di log aplikasi tidak
# ada kolom IP di posisi tetap seperti di access log nginx.
#
# Uji sebelum dipakai:
#   fail2ban-regex /var/www/dramaverse/storage/logs/keamanan-*.log \
#                  /etc/fail2ban/filter.d/laravel-pemindai.conf

[Definition]

failregex = ^\[.*\] .*Permintaan pemindai ditolak .*"ip":"<HOST>"

ignoreregex =

datepattern = ^\[({DATE})\]

# =============================================================================
# Nginx BAGIAN B — konfigurasi situs dracinverse.cloud
# =============================================================================
#
# Salin ke:  /etc/nginx/sites-available/dramaverse
#
# PRASYARAT: nginx-limits.conf harus sudah terpasang di
# /etc/nginx/conf.d/dracinverse-limits.conf lebih dulu. Berkas ini memakai zona
# `umum`, `cari`, `masuk`, `tulis`, dan `konkuren` yang dideklarasikan di sana.
#
# Menggantikan konfigurasi di DEPLOY.md 3.9. Perbedaannya bukan kosmetik:
# konfigurasi lama tidak punya satu pun pembatas laju, jadi setiap permintaan
# yang sampai ke port 443 diteruskan ke php-fpm apa adanya.
#
# php-fpm punya jumlah worker yang tetap - biasanya belasan. Nginx sanggup
# menerima puluhan ribu koneksi bersamaan, tapi meneruskannya ke antrean yang
# jauh lebih sempit. Begitu worker habis, permintaan berikutnya menunggu lalu
# 502. Yang mati bukan hanya halaman yang diserang: pembayaran, panel admin,
# dan webhook Telegram ikut berhenti karena mengantre di kolam yang sama.
#
# Menahannya di sini jauh lebih murah daripada di Laravel. Permintaan yang
# ditolak nginx tidak pernah menyalakan PHP dan biayanya beberapa mikrodetik;
# yang ditolak `throttle:` di Laravel sudah terlanjur membangunkan satu worker.
#

# Alihkan http ke https. Blok terpisah supaya port 80 tidak pernah menyajikan
# apa pun selain pengalihan.
server {
    listen 80;
    listen [::]:80;
    server_name dracinverse.cloud www.dracinverse.cloud;

    # Certbot butuh jalur ini tetap terbuka di http.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dracinverse.cloud www.dracinverse.cloud;

    root /var/www/dramaverse/public;
    index index.php;
    charset utf-8;

    # Sertifikat dipasang certbot; baris ini ditulis ulang olehnya.
    ssl_certificate     /etc/letsencrypt/live/dracinverse.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dracinverse.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # -------------------------------------------------------------------------
    # Batas ukuran & waktu
    # -------------------------------------------------------------------------
    #
    # Setiap batas di bawah ini menutup satu cara menahan sumber daya server
    # tanpa mengirim lalu lintas besar.
    #
    # `client_max_body_size` tetap 512M karena unggahan video memang sebesar
    # itu — tapi HANYA di jalur unggah. Di seluruh situs ia diturunkan drastis;
    # tidak ada alasan endpoint pencarian menerima kiriman 512 megabyte, dan
    # membiarkannya berarti siapa pun bisa memaksa server menampung setengah
    # gigabyte per permintaan hanya dengan mengirim POST ke halaman mana pun.
    client_max_body_size 2M;

    # Slowloris. Penyerang membuka koneksi lalu mengirim header satu byte
    # setiap beberapa detik, menahannya terbuka tanpa pernah selesai. Batas
    # waktu inilah yang memutusnya; tanpa itu koneksi menggantung sampai
    # nginx kehabisan slot.
    client_body_timeout   12s;
    client_header_timeout 12s;
    send_timeout          15s;
    keepalive_timeout     30s;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 8k;

    # Batas koneksi bersamaan per IP. 20 memberi ruang untuk peramban yang
    # membuka beberapa koneksi paralel plus beberapa tab.
    limit_conn konkuren 20;

    server_tokens off;

    # -------------------------------------------------------------------------
    # Metode HTTP
    # -------------------------------------------------------------------------
    #
    # Aplikasi ini hanya memakai GET, POST, dan HEAD. TRACE dan TRACK dipakai
    # untuk Cross-Site Tracing — server memantulkan kembali header permintaan
    # apa adanya, termasuk cookie yang seharusnya tidak terbaca JavaScript.
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }

    # -------------------------------------------------------------------------
    # Blokir pemindai sebelum PHP menyala
    # -------------------------------------------------------------------------
    #
    # Cermin dari middleware BlockProbeRequests di Laravel, sengaja tumpang
    # tindih. Bedanya harga: yang ditolak di sini tidak pernah membangunkan
    # php-fpm sama sekali.

    # Alat pemindai yang mengumumkan dirinya di User-Agent.
    if ($http_user_agent ~* (sqlmap|nikto|nessus|acunetix|nmap|masscan|zgrab|dirbuster|gobuster|wpscan|havij|arachni)) {
        return 444;   # 444 = tutup koneksi tanpa menjawab apa pun.
    }

    # -------------------------------------------------------------------------
    # DIHAPUS: penolakan permintaan tanpa User-Agent
    # -------------------------------------------------------------------------
    #
    #     if ($http_user_agent = "") { return 444; }
    #
    # Aturan ini pernah ada di sini dan HARUS TIDAK dikembalikan. Alasannya
    # dicatat lengkap karena idenya terdengar masuk akal dan gampang ditulis
    # ulang oleh siapa pun yang mengeraskan konfigurasi ini di kemudian hari.
    #
    # Premisnya: "peramban selalu mengirim User-Agent, yang tidak mengirim
    # hampir selalu skrip mentah." Premis itu benar untuk pengunjung manusia,
    # dan sepenuhnya salah untuk mesin yang memang berhak masuk.
    #
    # Yang dibunuhnya di sini:
    #
    #   POST /telegram/webhook    Server Telegram tidak mengirim User-Agent.
    #                             Setiap webhook dijawab 444, dan bot mati
    #                             total — tidak ada pesan masuk, tidak ada
    #                             login lewat bot, tidak ada pengiriman video.
    #
    #   POST /payment/callback/*  Banyak gateway pembayaran juga tidak
    #                             mengirimnya. Ini yang paling berbahaya:
    #                             gateway tidak mengeluh, ia hanya mencoba
    #                             ulang beberapa kali lalu menyerah. Pembayaran
    #                             yang sah tidak pernah mengaktifkan membership,
    #                             dan tidak ada satu pun galat aplikasi yang
    #                             muncul karena kodenya memang tidak pernah
    #                             dijalankan.
    #
    # Pola kegagalannya sama seperti pengecualian CSRF yang sempat terlewat
    # di bootstrap/app.php: penjagaan yang benar secara umum, dipasang di
    # jalur yang justru dilewati mesin sah, dan rusaknya tidak terlihat di
    # log aplikasi mana pun karena permintaannya berhenti sebelum aplikasi
    # menyala.
    #
    # Penyaringan pemindai tetap ada lewat daftar User-Agent di atas dan
    # daftar jalur di bawah. Keduanya menyaring berdasarkan apa yang dilakukan
    # permintaan, bukan berdasarkan header yang kebetulan kosong.

    # Jalur WordPress dan panel database yang tidak pernah ada di sini.
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|adminer|myadmin|dbadmin) {
        access_log off;
        return 444;
    }

    # Berkas rahasia dan cadangan. `.env` di sini adalah lapis ketiga —
    # seharusnya ia berada di luar `public/` dan memang begitu, tapi satu
    # kesalahan symlink sudah cukup untuk membocorkan seluruh kredensial.
    location ~* \.(env|git|sql|bak|old|swp|sqlite|log|ini|conf|zip|tar|gz)$ {
        access_log off;
        return 444;
    }

    # Berkas tersembunyi.
    location ~ /\.(?!well-known) { access_log off; return 444; }

    # -------------------------------------------------------------------------
    # Header keamanan
    # -------------------------------------------------------------------------
    #
    # `always` penting: tanpa itu header tidak dipasang pada jawaban 4xx/5xx —
    # justru halaman galat, tempat kebocoran informasi paling mungkin terjadi.
    #
    # HSTS menyuruh peramban tidak pernah lagi menyentuh http untuk domain ini,
    # bahkan sebelum permintaan dikirim. Ini menutup jendela antara pengguna
    # mengetik alamat dan pengalihan 301 kita sampai — jendela yang cukup
    # untuk pembajakan di jaringan wifi publik.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # -------------------------------------------------------------------------
    # Route
    # -------------------------------------------------------------------------

    # Login admin. Zona `masuk` hanya menghitung POST — lihat alasannya di
    # nginx-limits.conf.
    #
    # `nodelay` WAJIB di sini. Tanpanya nginx menahan permintaan yang melebihi
    # laju sampai jatahnya tersedia alih-alih menolaknya, dan pada halaman
    # login itu berarti formulir yang menggantung puluhan detik tanpa satu pun
    # keterangan. Menunggu tanpa penjelasan lebih buruk daripada ditolak
    # dengan jelas: yang pertama membuat orang mengira sistemnya rusak, yang
    # kedua membuatnya mencoba lagi sebentar kemudian.
    location = /admin/login {
        limit_req zone=masuk burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Pencarian.
    location ~ ^/search {
        limit_req zone=cari burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Unggahan admin — satu-satunya tempat batas 512M berlaku.
    location ~ ^/admin/(unggah|upload) {
        client_max_body_size 512M;
        client_body_timeout  600s;
        limit_req zone=tulis burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # -------------------------------------------------------------------------
    # Jalur mesin — dua endpoint yang TIDAK boleh disaring seperti pengunjung
    # -------------------------------------------------------------------------
    #
    # Keduanya dipanggil server luar, bukan peramban. Mereka tidak membawa
    # cookie, sering tidak membawa User-Agent, dan tidak pernah memuat halaman
    # apa pun lebih dulu. Setiap heuristik yang berpikir "seperti apa
    # pengunjung sungguhan" akan salah menilai keduanya.
    #
    # Yang menjaga keduanya bukan penyaringan di lapis ini, melainkan
    # pembuktian identitas di dalam aplikasi: webhook Telegram diperiksa
    # middleware `telegram.webhook` lewat secret token, callback pembayaran
    # diperiksa verifikasi tanda tangan di dalam driver masing-masing. Itu
    # penjagaan yang jauh lebih kuat daripada menebak dari header, dan tidak
    # punya salah-tolak.
    #
    # Ditulis sebagai location tersendiri supaya niatnya terbaca, dan supaya
    # siapa pun yang menambah aturan penyaringan baru di atas melihat lebih
    # dulu bahwa dua jalur ini punya sifat berbeda.

    # Webhook Telegram. Batas lajunya longgar: Telegram mengirim satu
    # permintaan per pesan masuk, dan lonjakan wajar terjadi setelah broadcast.
    location = /telegram/webhook {
        limit_req zone=tulis burst=50 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Callback pembayaran. Gateway kadang mengirim beruntun saat mencoba
    # ulang, jadi burst-nya longgar — kalau callback sah ditolak di sini,
    # pembayaran pelanggan tidak pernah aktif dan tidak ada galat yang muncul.
    location ~ ^/payment/callback {
        limit_req zone=tulis burst=30 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Aset statis. Dilayani nginx langsung, tidak pernah menyentuh PHP, jadi
    # dikecualikan dari batas laju — kalau tidak, satu pemuatan halaman yang
    # menarik dua puluh berkas akan menghabiskan jatah pemiliknya sendiri.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;   # =404, bukan /index.php: aset yang hilang
                               # tidak boleh diteruskan ke PHP.
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Semua sisanya.
    location / {
        limit_req zone=umum burst=50 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -------------------------------------------------------------------------
    # PHP — hanya index.php yang boleh dijalankan
    # -------------------------------------------------------------------------
    #
    # Ini menutup celah klasik: berkas .php yang berhasil diunggah ke direktori
    # publik lalu dipanggil langsung sebagai cangkang. Laravel memang hanya
    # butuh satu titik masuk, jadi membatasinya ke satu berkas tidak
    # menghilangkan apa pun.
    #
    # Dua blok terpisah, bukan bersarang. Nginx memeriksa `location = ` (exact
    # match) SEBELUM semua regex, jadi `/index.php` selalu jatuh ke blok
    # pertama dan `.php` lainnya ke blok kedua — tanpa perlu menyarangkan
    # location di dalam location, yang aturannya berbeda-beda antar versi
    # nginx dan gampang membuat `nginx -t` gagal.
    #
    # `try_files ... /index.php?$query_string` di atas menghasilkan pengalihan
    # internal, dan pengalihan internal menjalankan pencocokan location dari
    # awal — jadi ia tetap sampai ke blok exact match ini.

    location = /index.php {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        access_log off;
        return 404;
    }

    error_page 404 /index.php;

    access_log /var/log/nginx/dracinverse-access.log;
    error_log  /var/log/nginx/dracinverse-error.log;
}

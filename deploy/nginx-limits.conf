# =============================================================================
# Nginx BAGIAN A — zona pembatas laju & IP asli
# =============================================================================
#
# Salin ke:  /etc/nginx/conf.d/dracinverse-limits.conf
#
# Terpisah dari konfigurasi situs karena direktif di bawah HARUS berada di
# konteks `http`, bukan di dalam blok `server`. Nginx menolak start kalau
# `limit_req_zone` diletakkan di dalam `server{}`, dan berkas di
# /etc/nginx/conf.d/ otomatis dimuat ke dalam konteks http oleh nginx.conf
# bawaan Ubuntu.
#
# Dipasang lebih dulu daripada BAGIAN B: konfigurasi situs merujuk zona yang
# dideklarasikan di sini, jadi kalau urutannya dibalik `nginx -t` gagal dengan
# "unknown limit_req_zone".
#
# IP asli pengunjung
# -----------------------------------------------------------------------------
#
# Ini prasyarat, bukan pelengkap. Tanpa `real_ip`, setiap pengunjung di balik
# Cloudflare terlihat datang dari segelintir IP milik Cloudflare — dan setiap
# pembatas laju yang menghitung "per IP" (di nginx maupun di Laravel) berhenti
# membedakan siapa pun. Seluruh Indonesia berbagi satu jatah 120 permintaan
# per menit, sementara penyerang mendapat jatah yang sama besarnya.
#
# Efeknya diam-diam terbalik: pembatas laju berubah dari pelindung menjadi
# senjata. Penyerang yang memakai IP Cloudflare yang sama dengan pengguna asli
# menghabiskan jatah bersama itu, dan pengguna asli yang kena 429.
#
# Aktifkan HANYA bila Cloudflare (atau proxy lain) benar-benar dipasang di
# depan. Bila nginx menerima langsung dari internet, biarkan seluruh blok ini
# dikomentari — mempercayai header `CF-Connecting-IP` dari sembarang pengirim
# berarti siapa pun bisa menuliskan IP palsu di sana dan lolos dari semua
# batas per-IP sekaligus.
#
# Daftar terbaru: https://www.cloudflare.com/ips/
#
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 103.22.200.0/22;
# set_real_ip_from 103.31.4.0/22;
# set_real_ip_from 141.101.64.0/18;
# set_real_ip_from 108.162.192.0/18;
# set_real_ip_from 190.93.240.0/20;
# set_real_ip_from 188.114.96.0/20;
# set_real_ip_from 197.234.240.0/22;
# set_real_ip_from 198.41.128.0/17;
# set_real_ip_from 162.158.0.0/15;
# set_real_ip_from 104.16.0.0/13;
# set_real_ip_from 104.24.0.0/14;
# set_real_ip_from 172.64.0.0/13;
# set_real_ip_from 131.0.72.0/22;
# set_real_ip_from 2400:cb00::/32;
# set_real_ip_from 2606:4700::/32;
# set_real_ip_from 2803:f800::/32;
# set_real_ip_from 2405:b500::/32;
# set_real_ip_from 2405:8100::/32;
# set_real_ip_from 2a06:98c0::/29;
# set_real_ip_from 2c0f:f248::/32;
# real_ip_header CF-Connecting-IP;

# -----------------------------------------------------------------------------
# Zona pembatas laju
# -----------------------------------------------------------------------------
#
# 10m menampung sekitar 160 ribu IP. Jauh lebih besar daripada jumlah
# pengunjung wajar, dan itu memang tujuannya: kalau zonanya penuh, nginx mulai
# membuang catatan tertua — persis perilaku yang dimanfaatkan penyerang dengan
# membanjiri IP palsu supaya catatan IP-nya sendiri terdorong keluar.

# Halaman umum. 30 r/s terdengar besar untuk satu orang, tapi satu halaman
# memuat belasan aset; angkanya harus muat untuk pemuatan halaman utuh.
limit_req_zone $binary_remote_addr zone=umum:10m rate=30r/s;

# Pencarian. `LIKE '%kata%'` tidak bisa memakai indeks, jadi setiap permintaan
# adalah pemindaian tabel penuh. Harganya beda kelas, batasnya juga.
limit_req_zone $binary_remote_addr zone=cari:10m rate=2r/s;

# Login admin.
#
# ## Kenapa dihitung hanya untuk POST
#
# `location = /admin/login` cocok untuk GET maupun POST — GET menampilkan
# formulirnya, POST mengirimkannya. Menghitung keduanya berarti sekadar
# MEMBUKA halaman login sudah memakai jatah, dan admin yang salah ketik lalu
# memuat ulang menghabiskan jatahnya tanpa satu pun percobaan masuk.
#
# `map` di bawah mengosongkan kuncinya untuk metode selain POST. Kunci kosong
# tidak dihitung sama sekali oleh nginx — itu cara resmi mengecualikan
# permintaan dari limit_req.
map $request_method $kunci_masuk {
    POST    $binary_remote_addr;
    default "";
}

# ## Kenapa 1r/m dinaikkan
#
# Angka lama 1r/m dipilih dengan alasan yang benar — tidak ada manusia yang
# login dua kali per detik — tetapi akibatnya salah. Digabung dengan `burst`
# TANPA `nodelay`, nginx tidak menolak kelebihannya melainkan MENAHANNYA
# sampai jatahnya tersedia: percobaan kedua menggantung 60 detik, ketiga 120
# detik. Bagi admin yang salah ketik password sekali, panel berubah jadi
# halaman yang "lama sekali kalau dimasuk" tanpa satu pun pesan yang
# menjelaskan kenapa.
#
# Penjaga brute force yang sesungguhnya bukan lapis ini, melainkan
# `throttle:admin-login` di dalam aplikasi — yang menghitung per kombinasi
# IP dan email, dan menjawab dengan halaman yang bisa dibaca orang.
limit_req_zone $kunci_masuk zone=masuk:10m rate=20r/m;

# Endpoint POST umum (checkout, favorit, request drama).
limit_req_zone $binary_remote_addr zone=tulis:10m rate=5r/s;

# Batas koneksi bersamaan. Berbeda dari batas laju dan keduanya diperlukan:
# `limit_req` menahan permintaan cepat yang selesai, `limit_conn` menahan
# koneksi lambat yang menggantung. Slowloris tidak melanggar batas laju sama
# sekali — ia mengirim satu permintaan lalu menahannya terbuka selama mungkin,
# dan hanya `limit_conn` yang melihatnya.
limit_conn_zone $binary_remote_addr zone=konkuren:10m;

# 429, bukan 503. 503 berarti "server sedang bermasalah" dan membuat mesin
# pencari menurunkan peringkat situs; 429 berarti "kamu terlalu cepat", yang
# memang persis keadaannya.
limit_req_status 429;
limit_conn_status 429;

# Hanya catat penolakan sebagai warn, bukan error — supaya log error tetap
# berisi kerusakan sungguhan dan tidak tenggelam saat serangan berlangsung.
limit_req_log_level warn;


